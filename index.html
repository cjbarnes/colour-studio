function about(){modal('About the model',`<p>Colour Studio uses Apple’s documented chromatic system colours and iOS/iPadOS numbered greys, interpreted as sRGB. The current HIG publishes a shared chromatic table, not separate numeric AppKit variants.</p><p class="small" style="margin-top:8px"><a href="https://developer.apple.com/design/human-interface-guidelines/color" target="_blank" rel="noopener">Apple Human Interface Guidelines: Color</a></p><hr><p><strong>Vivid:</strong> circular piecewise linear interpolation of perceptual lightness, relative chroma and appearance hue offsets between 11 anchors. <strong>Complex:</strong> brown’s measured lightness, relative chroma and hue offsets applied at a new hue. Family blends these profiles; brown retains its own family unless individually overridden.</p><p style="margin-top:8px"><strong>Intensity</strong> multiplies relative chroma; <strong>Lightness</strong> adds an OKLCH offset; <strong>Temperature</strong> bends hues towards or away from 60° using a sine; <strong>Hue rotation</strong> rotates the spectrum. Relative chroma is C divided by the sRGB gamut limit at L and H. Neutral tints use absolute chroma and retain the six-step lightness hierarchy.</p><p style="margin-top:8px">The engine reduces chroma to fit sRGB, then rounds to 8-bit HEX. Contrast is WCAG relative luminance ratio, not a generation constraint. Appearance values are illustrative design references, not a promise about live OS values.</p><details><summary>Source values and measured properties</summary><div class="table-scroll"><table><thead><tr><th>Colour</th><th>Appearance</th><th>HEX</th><th>L</th><th>C</th><th>H</th><th>Q</th></tr></thead><tbody>${Object.entries(RAW).map(([k,a])=>a.map((c,i)=>{let v=refs[k][i];return `<tr><td>${k}</td><td>${APP[i]}</td><td>#${c}</td><td>${v.L.toFixed(4)}</td><td>${v.C.toFixed(4)}</td><td>${v.H.toFixed(1)}</td><td>${(v.Q*100).toFixed(1)}%</td></tr>`}).join('')).join('')}${GRAY.map((a,j)=>a.map((c,i)=>{let v=toLCH(c);return `<tr><td>Grey ${j+1}</td><td>${APP[i]}</td><td>#${c}</td><td>${v.L.toFixed(4)}</td><td>${v.C.toFixed(4)}</td><td>${v.H.toFixed(1)}</td><td>${(v.Q*100).toFixed(1)}%</td></tr>`}).join('')).join('')}</tbody></table></div></details><button id="runTests">Run numerical self-tests</button><p id="testResult" class="small muted" style="margin-top:8px"></p>`)}
function selfTests(){let count=0;function check(v,msg){if(!v)throw Error(msg);count++}for(let [name,values] of Object.entries(RAW)){for(let c of values){let v=toLCH(c);check(fromLCH(v.L,v.C,v.H)==='#'+c,'Round trip '+c)}let r=sysRows().find(r=>r.system===name);check(JSON.stringify(generate(r,defaults))===JSON.stringify(values.map(c=>'#'+c)),'Reference '+name)}for(let a of GRAY)for(let c of a){let v=toLCH(c);check(fromLCH(v.L,v.C,v.H)==='#'+c,'Grey '+c)}for(let h=0;h<360;h+=9)for(let f of [0,50,100]){let r=newRow(h),g={...defaults,family:f};for(let c of generate(r,g))check(/^#[0-9A-F]{6}$/.test(c),'Gamut output')}for(let a of ['0','1','2','3']){let r={...newRow(),mode:'seed',seed:'#4169E1',appearance:a};check(generate(r,defaults)[+a]===r.seed,'Seed '+a)}check(Math.abs(contrast('#000000','#FFFFFF')-21)<1e-9,'Contrast');check(fromLCH(.5,0,30)===fromLCH(.5,0,270),'Neutral');check(JSON.stringify(profile(0,0))===JSON.stringify(profile(360,0)),'Circular hue');check(fromHSL(240,100,50)==='#0000FF','HSL');check(outputs().every(r=>r.values.length===4),'Four outputs');let a=toLCH('#FF383C'),b=toLCH('#FF2D55');check(okDistance(a,a)===0,'Identical colour distance');check(Math.abs(okDistance(a,b)-okDistance(b,a))<1e-12,'Symmetric colour distance');check(Math.abs(okDistance(toLCH('#000000'),toLCH('#FFFFFF'))-100)<1e-5,'Black white distance');check(okDistance(a,b)>0&&okDistance(a,b)<okDistance(a,toLCH('#00C8B3')),'Reference distance ordering');check(Math.abs(okDistance({L:.5,C:.2,H:359},{L:.5,C:.2,H:1})-40*Math.sin(rad(1)))<1e-9,'Circular distance');return count}
// ---- event delegation ----
document.addEventListener('click',e=>{let point=e.target.closest('[data-wheel-edit]');if(point){edit=point.dataset.wheelEdit;tab='single';render();return}let b=e.target.closest('button');if(!b)return;let d=b.dataset,k=b.id;try{if(d.colourPreset){let r=current();if(r.lock)return;rowChange(r=>{r.over.family=d.colourPreset==='brown'?100:0;r.over.intensity=d.colourPreset==='half'?50:100});return}if(k==='togglePaletteSidebar'){paletteSidebar=!paletteSidebar;render();return}if(d.tab){switchTab(d.tab);return}if(d.edit){edit=d.edit;tab='single';render();return}if(d.copy){copy(d.copy);return}if(d.move){let [id,step]=d.move.split(':'),i=state.rows.findIndex(r=>r.id===id),j=i+Number(step);if(j>=0&&j<state.rows.length){change(()=>{[state.rows[i],state.rows[j]]=[state.rows[j],state.rows[i]]});let el=$('.row-list')?.parentElement;if(el)el.open=true}return}if(d.duplicate){let i=state.rows.findIndex(r=>r.id===d.duplicate);if(i>=0&&state.rows.length<100)change(()=>{let r=clone(state.rows[i]);r.id=id();r.name+=' copy';state.rows.splice(i+1,0,r)});let el=$('.row-list')?.parentElement;if(el)el.open=true;return}if(d.remove){let i=state.rows.findIndex(r=>r.id===d.remove);if(i>=0){change(()=>state.rows.splice(i,1));let el=$('.row-list')?.parentElement;if(el)el.open=true}return}if(d.manual!==undefined){let i=Number(d.manual),r=current();if(r.lock){toast('Unlock the colour before overriding.');return}modal('Override '+APP[i],`<div class="field"><label>Exact colour</label><input id="manualValue" value="${generate(r,state.global)[i]}"></div><button id="confirmManual" data-index="${i}" class="primary">Apply override</button> <button id="cancelModal">Cancel</button>`);return}if(d.clearManual!==undefined){rowChange(r=>delete r.manual[Number(d.clearManual)]);return}if(d.neutralPreset){let [h,c]=d.neutralPreset.split(':').map(Number);change(()=>{state.neutral.h=h;state.neutral.c=c;state.neutral.lightness=0});return}if(d.export){let rows=outputs($('#includeNeutral').checked),name=safeName(state.name);if(d.export==='assets')download(name+'-xcassets.zip',zip(assetFiles(rows)));else download(name+'.'+d.export,exportText(rows,d.export),d.export==='json'?'application/json':d.export==='html'?'text/html':'text/plain');return}if(k==='undo'&&undo.length){redo.push(clone(state));state=undo.pop();store();render()}else if(k==='redo'&&redo.length){undo.push(clone(state));state=redo.pop();store();render()}else if(k==='new')newDialog();else if(k==='open')$('#file').click();else if(k==='save')download(safeName(state.name)+'.colour-studio.json',JSON.stringify(state,null,2),'application/json');else if(k==='export')exportDialog();else if(k==='about')about();else if(k==='runTests')$('#testResult').textContent=selfTests()+' checks passed.';else if(k==='resetGlobal')change(()=>state.global={...defaults});else if(k==='resetRow')rowChange(r=>r.over={});else if(k==='resetNeutrals')change(()=>state.neutral=project().neutral);else if(k==='add'){draft=newRow();edit=null;tab='single';render()}else if(k==='addDraft'){if(state.rows.length>=100){toast('Maximum 100 colours');return}change(()=>{let r=clone(draft);r.id=id();state.rows.push(r);tab='palette';edit=null;draft=newRow()});toast('Colour added')}else if(k==='closeModal'||k==='cancelModal')closeModal();else if(k==='confirmNew'){let kind=$('#newKind').value,count=clamp(Math.round(Number($('#newCount').value)||12),2,48),h=mod(Number($('#newHue').value)||0);change(()=>{state=project(kind,count,h);edit=null;tab='palette';draft=newRow()});closeModal()}else if(k==='confirmManual'){let c=parseColour($('#manualValue').value);rowChange(r=>r.manual[Number(d.index)]=c);closeModal()}else if(k==='copyAll')copy(exportText(outputs($('#includeNeutral').checked),'txt'))}catch(err){toast(err.message)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.wheelEdit){e.preventDefault();edit=e.target.dataset.wheelEdit;tab='single';render();return}if(e.key==='Escape')closeModal();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$(e.shiftKey?'#redo':'#undo').click()}});
render();
</script></body></html>
